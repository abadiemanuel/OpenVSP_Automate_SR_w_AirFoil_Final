name: GenAirDes
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      # Core scientific stack
      - numpy==2.4.2
      - pandas==3.0.0
      - matplotlib==3.10.8
      - scipy==1.17.0

      # Machine learning
      - scikit-learn==1.8.0
      - joblib==1.5.3

      # Multi-objective optimization
      - pymoo==0.6.1.6

      # OpenVSP Python API
      - -e ./OpenVSP-3.47.0-win64/python/openvsp_config
      - ./OpenVSP-3.47.0-win64/python/degen_geom
      - ./OpenVSP-3.47.0-win64/python/utilities
      - ./OpenVSP-3.47.0-win64/python/openvsp

      # VTK
      - vtk==9.6.0

      # Parsing
      - pyparsing==3.3.2

      # JupyterLab
      - jupyterlab==4.5.4